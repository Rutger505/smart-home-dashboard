[package]
edition      = "2024"
name         = "smart-home-dashboard"
default-run  = "smart-home-dashboard"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "smart-home-dashboard"
path = "./src/bin/main.rs"

[lints.rust]
async_fn_in_trait = "allow"

[dependencies]
esp-hal = { version = "~1.1.2", features = ["esp32", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp32"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }

critical-section  = "1.2.0"
dht-sensor        = "0.3.0"
embassy-executor  = "0.10.0"
embassy-futures   = "0.1.2"
embassy-time      = "0.5.1"
embedded-hal      = "1.0.0"
embedded-io-async = "0.7.0"
esp-alloc         = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32"] }
log         = "0.4.34"
embassy-sync = "0.8.0"
libm = "0.2.16"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
